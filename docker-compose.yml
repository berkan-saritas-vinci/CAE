services:

  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
    ports:
      - "5172:5172"
    depends_on:
      - api

  api:
    container_name: api
    image: api
    build:
      context: ./api
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  db:
    image: postgres:latest
    container_name: db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"

  reverse-proxy:
    container_name: reverse-proxy-demo
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf